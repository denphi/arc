[project]
name = "arc"
dynamic = ["version"]
description = "Agentic research framework built around Sim2L artifacts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]
vector = [
  "chromadb>=0.5.0",
]
docker = [
  "docker>=7.0.0",
]
sim2l = [
  "sim2l",
]
anthropic = [
  "anthropic>=0.25.0",
]
openai = [
  "openai>=1.0.0",
]
openwebui = [
  "openai>=1.0.0",   # uses the openai SDK with a custom base_url + bearer token
]
all = [
  "anthropic>=0.25.0",
  "openai>=1.0.0",
  "typer>=0.12.0",
]

[project.scripts]
arc = "arc.cli.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "arc.version.__version__"}

[tool.setuptools.packages.find]
include = ["arc*"]

[tool.setuptools.package-data]
arc = [
  "arc.toml",
  "packages/**/*.yaml",
  "packages/**/*.yml",
  "packages/**/*.md",
  "skills/**/*.md",
  "templates/**/*",
  "extensions/**/*",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
