# ReadTheDocs build configuration for ARC.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  # The build is clean (0 warnings); keep it that way — a new warning fails the
  # RTD build, matching the GitHub Actions docs job (sphinx-build -W).
  fail_on_warning: true

python:
  install:
    # Install ARC (editable) so autodoc can import arc.* for the API reference.
    - method: pip
      path: .
    - requirements: docs/requirements.txt

formats:
  - htmlzip
