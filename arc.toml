# ── Project config for this checkout ───────────────────────────────────
#
# Overlays the bundled defaults in ``arc/arc.toml`` when ARC runs from this
# directory. Only list what differs from the defaults here:
#   * ``[packages].paths`` entries are APPENDED to the bundled package list
#     (paths relative to this file), e.g. paths = ["../arc-fenics"];
#   * any other key overrides the bundled value.
#
# Environment variables (ARC_PROVIDER, ARC_MODEL, ARC_RUNTIME_ADAPTER, …)
# override everything in either file.

# [provider]
# Open-weight models via OpenWebUI / Purdue GenAI gateway. The token is read
# from OPENWEBUI_KEY (never put tokens in this file).
# name = "openwebui"
# base_url = "https://genai.rcac.purdue.edu/api"
# model = ""        # blank = auto-select, or e.g. "llama3.3:70b"

# [strategies]
# builder = "codex"
