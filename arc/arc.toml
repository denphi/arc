[arc]
name = "ARC-Sim2L"
version = "0.1.0"

[packages]
paths = [
  "packages/arc-sim2l",
  "packages/arc-mars",
  "packages/arc-materials",
  "packages/arc-codex",
  "packages/arc-claude-code",
]

[runtime]
adapter = "local"
workspace = "workspace"

[provider]
# Token/model can also be passed per-request.
name = "openwebui"
base_url = "https://genai.rcac.purdue.edu/api"
model = ""

[memory]
artifact_registry = "workspace/artifacts"
results_store = "workspace/runs"
provenance_log = "workspace/memory/provenance.jsonl"

[api]
host = "0.0.0.0"
port = 8000
reload = false

[extensions]

[extensions.vector-memory]
enabled = false
backend = "chroma"
persist_path = "workspace/memory/vectors"

[extensions.docker-runtime]
enabled = false
image = "sim2l/runner:latest"

[extensions.slurm-runtime]
enabled = false
partition = "general"

[extensions.web-ui]
enabled = false
port = 8501
