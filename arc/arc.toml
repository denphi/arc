# ── ARC fallback config (NOT the source of truth) ───────────────────────
#
# The authoritative config is the repo-level `arc/arc.toml`. ``load_arc_toml``
# (see arc/arc/core/config.py) resolves the repo-level file first and only
# falls back to THIS file when that one is missing.
#
# To avoid two diverging package/extension lists (design/todo.md item 11),
# this fallback intentionally declares NO package paths and NO extension
# blocks — edit the repo-level `arc/arc.toml` for those. This file only
# carries enough metadata to let the kernel start in a degraded, package-less
# mode if the real config has been moved or deleted.

[arc]
name = "ARC-Sim2L"
version = "0.1.0"

[runtime]
adapter = "local"
workspace = "workspace"

[memory]
artifact_registry = "workspace/artifacts"
results_store = "workspace/runs"
provenance_log = "workspace/memory/provenance.jsonl"

[api]
host = "0.0.0.0"
port = 8000
reload = false
