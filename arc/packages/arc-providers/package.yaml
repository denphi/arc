name: arc-providers
version: 0.1.0
type: provider-package
description: >
  Bundled LLM providers beyond the core's built-in openwebui. Core ships
  only openwebui (the universal OpenAI-compatible client); anthropic and
  openai live here as a package so adding a provider never touches core —
  it's a new `provides.providers` entry. Third-party provider packages
  follow the same pattern.

provides:
  providers:
    - name: anthropic
      entrypoint: arc.packages.arc-providers.providers.anthropic:AnthropicProvider
    - name: openai
      entrypoint: arc.packages.arc-providers.providers.openai:OpenAIProvider

config:
  - name: ANTHROPIC_API_KEY
    description: API key for the anthropic provider.
    required: false   # only needed when --provider anthropic is selected
    secret: true
  - name: OPENAI_API_KEY
    description: API key for the openai provider.
    required: false
    secret: true
  - name: ARC_MODEL
    description: Default model id for anthropic/openai when not passed per-request.
    required: false
    default: ""

requires:
  # The provider SDKs are optional extras; a provider only needs its SDK
  # installed when actually selected (the import is lazy inside the class).
  integrations:
    - anthropic
    - openai
