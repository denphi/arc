[project]
name = "arc"
dynamic = ["version"]
description = "Agentic research framework built around Sim2L artifacts"
readme = "README.md"
# 3.9 is supported only so arc can run inside the legacy-FEniCS/DOLFIN 2019.1.x
# conda env, which ships py39-only builds (see arc-fenics). On 3.9, pydantic v2
# resolves stringized `X | None` annotations at class-build time via eval(),
# which needs eval_type_backport (declared below). On 3.10+ none of that runs.
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "prompt-toolkit>=3.0.0",
  "pyyaml>=6.0.0",
  # HTTP client for the sim2l services, catalog/searcher agents and the
  # openapi extension.
  "requests>=2.31.0",
  # Powers the `arc` console script (arc.cli.main).
  "typer>=0.12.0",
  # Lets pydantic evaluate PEP 604 (`X | None`) annotations under Python 3.9.
  "eval_type_backport>=0.2.0; python_version < '3.10'",
  # `tomllib` is stdlib only on 3.11+; arc.core.config falls back to `tomli`.
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  # fastapi.testclient needs httpx.
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]
vector = [
  "chromadb>=0.5.0",
]
docker = [
  "docker>=7.0.0",
]
sim2l = [
  "sim2l",
]
anthropic = [
  "anthropic>=0.25.0",
]
openai = [
  "openai>=1.0.0",
]
openwebui = [
  "openai>=1.0.0",   # uses the openai SDK with a custom base_url + bearer token
]
mcp = [
  "mcp>=1.0.0",
]
all = [
  "anthropic>=0.25.0",
  "openai>=1.0.0",
  "mcp>=1.0.0",
]

[project.scripts]
arc = "arc.cli.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "arc.version.__version__"}

[tool.setuptools.packages.find]
include = ["arc*"]

[tool.setuptools.package-data]
arc = [
  "arc.toml",
  "packages/**/*.yaml",
  "packages/**/*.yml",
  "packages/**/*.md",
  "skills/**/*.md",
  "templates/**/*",
  "extensions/**/*",
  "ui/static/**/*",
]

[tool.ruff]
line-length = 100
# Lowest supported runtime. Drives the FA rules below: any `X | Y` annotation
# (PEP 604) used without `from __future__ import annotations` is flagged,
# because it would fail to evaluate on 3.9 — the interpreter the legacy-FEniCS
# conda stack ships. This makes "support 3.9 and 3.10" enforceable instead of a
# convention contributors on 3.10 silently break.
target-version = "py39"

[tool.ruff.lint]
# FA = flake8-future-annotations: require the future-import wherever PEP 604/585
# syntax is used, so the code stays importable on 3.9 while still reading as
# modern `X | None`. FA102 specifically guards the 3.9 regression.
select = ["E", "F", "I", "FA"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt templates: reflowing these triple-quoted strings would change
# the text the model sees.
"arc/packages/arc-sim2l/agents/planner.py" = ["E501"]
"arc/packages/arc-sim2l/agents/reviewer.py" = ["E501"]
"arc/packages/arc-claude-code/agents/coder.py" = ["E501"]

[tool.mypy]
# Current mypy can't target 3.9; the 3.9 syntax guard is ruff's
# target-version + FA rules above (and the py3.9 CI job).
python_version = "3.10"
strict = false
ignore_missing_imports = true
# Bundled packages live in hyphenated dirs (arc-sim2l, …) that mypy can't map
# to module names; they're imported at runtime as arc.packages.arc_sim2l….
exclude = ["^arc/packages/arc-"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "chat: fast tests for the arc.chat REPL (no LLM, no disk beyond tmp_path)",
    "integration: slow tests that spawn real services or hit the network",
]
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated:DeprecationWarning:websockets\\.legacy",
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning:uvicorn\\.protocols\\.websockets\\.websockets_impl",
]
