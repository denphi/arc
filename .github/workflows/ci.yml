name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy arc

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the legacy-FEniCS conda runtime (see pyproject.toml).
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests -q

  package:
    # A regular (non-editable) install must work outside the checkout:
    # bundled packages, skills and workflows ship inside the wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - name: Install wheel and smoke-test outside the repo
        run: |
          python -m venv /tmp/arc-venv
          /tmp/arc-venv/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP"
          export SIM2L_HOME="$RUNNER_TEMP/sim2l"
          /tmp/arc-venv/bin/arc info | tee info.txt
          grep -q "research-loop" info.txt
          /tmp/arc-venv/bin/arc run "smoke test goal"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -r docs/requirements.txt
      - run: sphinx-build -W -b html docs docs/_build/html
